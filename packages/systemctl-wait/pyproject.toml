[project]
name = "systemctl-wait"
version = "0.1.0"
description = "Wait for logind inhibitors before running a power action"
requires-python = ">=3.11"
dependencies = ["dbus-fast>=4.0.0"]

[project.scripts]
systemctl-wait = "systemctl_wait:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemctl_wait"]

[tool.hatch.build.targets.sdist]
include = ["src/systemctl_wait", "pyproject.toml"]
